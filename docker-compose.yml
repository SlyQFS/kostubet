services:
  kostubet-github:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kostubet-github
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - kostubet_data:/data
    healthcheck:
      # The bot exposes no HTTP server; verify the process is alive.
      test: ["CMD", "pgrep", "-f", "kostubet-github"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  kostubet_data:
